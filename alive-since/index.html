<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Alive Since — FunBite</title>
<meta name="description" content="A live counter of every second you've been alive.">
<link rel="icon" type="image/png" href="../apple-touch-icon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #FFFFFF;
    --ink: #15131F;
    --ink-soft: rgba(21,19,31,.62);
    --red: #FF5C5C;
    --red-soft: #FFECEC;
    --line: rgba(21,19,31,.08);
  }
  *{ box-sizing: border-box; }
  html{ -webkit-text-size-adjust: 100%; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', system-ui, sans-serif;
    line-height: 1.5;
  }
  h1{ font-family: 'Baloo 2', ui-rounded, sans-serif; margin: 0; }
  a{ color: inherit; }

  .wrap{
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 22px 60px;
  }

  .back{
    display: inline-block;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-soft);
    padding: 6px 0;
  }

  header{
    text-align: center;
    padding: 18px 0 8px;
  }
  header h1{
    font-size: clamp(28px, 8vw, 36px);
  }
  .tagline{
    margin: 8px 0 0;
    color: var(--ink-soft);
    font-size: 15px;
  }

  .card{
    background: var(--red-soft);
    border-radius: 24px;
    padding: 22px;
    margin-top: 18px;
  }

  label{
    display: block;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .02em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 14px 0 6px;
  }
  label:first-child{ margin-top: 0; }

  input[type="date"], input[type="time"]{
    width: 100%;
    padding: 13px 14px;
    border-radius: 14px;
    border: 2px solid var(--line);
    background: #fff;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
  }

  .error{
    margin-top: 10px;
    color: #B8283F;
    font-weight: 700;
    font-size: 14px;
    display: none;
  }

  button{
    font-family: inherit;
    font-weight: 800;
    font-size: 16px;
    border: none;
    cursor: pointer;
  }

  #startBtn, #editBtn{
    width: 100%;
    margin-top: 18px;
    padding: 15px;
    border-radius: 16px;
    background: var(--red);
    color: #fff;
    box-shadow: 0 10px 20px -10px rgba(255,92,92,.7);
  }
  #startBtn:active, #editBtn:active{ transform: translateY(1px); }

  #counter{ text-align: center; }

  .big-number{
    font-family: 'Baloo 2', ui-rounded, sans-serif;
    font-size: clamp(42px, 15vw, 64px);
    font-weight: 800;
    color: var(--red);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .big-number.pulse{ animation: pulse .35s ease; }
  @keyframes pulse{
    0%{ transform: scale(1); }
    40%{ transform: scale(1.05); }
    100%{ transform: scale(1); }
  }
  .big-label{
    margin-top: 4px;
    font-weight: 700;
    color: var(--ink-soft);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 22px 0 6px;
  }
  .stat{
    background: #fff;
    border-radius: 14px;
    padding: 10px 4px;
  }
  .stat span{
    display: block;
    font-family: 'Baloo 2', ui-rounded, sans-serif;
    font-weight: 700;
    font-size: clamp(15px, 5vw, 19px);
    font-variant-numeric: tabular-nums;
  }
  .stat label{
    margin: 2px 0 0;
    font-size: 10px;
    text-transform: uppercase;
  }

  .fun-facts{
    margin-top: 16px;
    display: grid;
    gap: 8px;
    text-align: left;
  }
  .fact{
    background: #fff;
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .fact span{
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    color: var(--red);
  }

  [hidden]{ display: none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../">← FunBite</a>

    <header>
      <h1>Alive Since</h1>
      <p class="tagline">Tick. Tick. Tick. You're still here.</p>
    </header>

    <section class="card" id="setup">
      <label for="birthDate">When were you born?</label>
      <input type="date" id="birthDate">

      <label for="birthTime">What time, roughly?</label>
      <input type="time" id="birthTime" value="00:00">

      <p class="error" id="errorMsg">That date doesn't work — try picking a day in the past.</p>

      <button id="startBtn">Start the clock</button>
    </section>

    <section class="card" id="counter" hidden>
      <div class="big-number" id="secondsBig">0</div>
      <div class="big-label">seconds alive</div>

      <div class="grid">
        <div class="stat"><span id="years">0</span><label>years</label></div>
        <div class="stat"><span id="days">0</span><label>days</label></div>
        <div class="stat"><span id="hours">0</span><label>hours</label></div>
        <div class="stat"><span id="minutes">0</span><label>minutes</label></div>
      </div>

      <div class="fun-facts">
        <div class="fact">🫀 <span id="heartbeats">0</span> heartbeats</div>
        <div class="fact">💨 <span id="breaths">0</span> breaths</div>
        <div class="fact">👁️ <span id="blinks">0</span> blinks</div>
        <div class="fact">🌍 <span id="orbitKm">0</span> km traveled around the sun</div>
      </div>

      <button id="editBtn">Change birthday</button>
    </section>
  </div>

<script>
  const setupEl = document.getElementById('setup');
  const counterEl = document.getElementById('counter');
  const dateInput = document.getElementById('birthDate');
  const timeInput = document.getElementById('birthTime');
  const errorMsg = document.getElementById('errorMsg');
  const secondsBig = document.getElementById('secondsBig');

  const els = {
    years: document.getElementById('years'),
    days: document.getElementById('days'),
    hours: document.getElementById('hours'),
    minutes: document.getElementById('minutes'),
    heartbeats: document.getElementById('heartbeats'),
    breaths: document.getElementById('breaths'),
    blinks: document.getElementById('blinks'),
    orbitKm: document.getElementById('orbitKm')
  };

  let birthDate = null;
  let tickHandle = null;

  function fmt(n){ return Math.floor(n).toLocaleString(); }

  function tick(){
    const now = new Date();
    const totalSeconds = Math.max(0, (now - birthDate) / 1000);

    secondsBig.textContent = fmt(totalSeconds);
    secondsBig.classList.remove('pulse');
    void secondsBig.offsetWidth; // restart the pulse animation each second
    secondsBig.classList.add('pulse');

    els.years.textContent = fmt(totalSeconds / 31557600);
    els.days.textContent = fmt(totalSeconds / 86400);
    els.hours.textContent = fmt(totalSeconds / 3600);
    els.minutes.textContent = fmt(totalSeconds / 60);

    els.heartbeats.textContent = fmt((totalSeconds / 60) * 72);
    els.breaths.textContent = fmt((totalSeconds / 60) * 16);
    els.blinks.textContent = fmt((totalSeconds / 60) * 15);
    els.orbitKm.textContent = fmt(totalSeconds * 29.78);
  }

  function startClock(){
    if (tickHandle) clearInterval(tickHandle);
    tick();
    tickHandle = setInterval(tick, 1000);
  }

  function showCounter(){
    setupEl.hidden = true;
    counterEl.hidden = false;
    startClock();
  }

  function tryStart(){
    const d = dateInput.value;
    const t = timeInput.value || '00:00';
    if (!d){
      errorMsg.style.display = 'block';
      errorMsg.textContent = "Pick a birthday first!";
      return;
    }
    const candidate = new Date(`${d}T${t}:00`);
    if (isNaN(candidate.getTime()) || candidate > new Date()){
      errorMsg.style.display = 'block';
      return;
    }
    errorMsg.style.display = 'none';
    birthDate = candidate;
    localStorage.setItem('funbite-alive-date', d);
    localStorage.setItem('funbite-alive-time', t);
    showCounter();
  }

  document.getElementById('startBtn').addEventListener('click', tryStart);
  document.getElementById('editBtn').addEventListener('click', () => {
    if (tickHandle) clearInterval(tickHandle);
    counterEl.hidden = true;
    setupEl.hidden = false;
  });

  // Remember the last birthday on this device and start right away.
  const savedDate = localStorage.getItem('funbite-alive-date');
  if (savedDate){
    dateInput.value = savedDate;
    timeInput.value = localStorage.getItem('funbite-alive-time') || '00:00';
    tryStart();
  }
</script>
</body>
</html>
