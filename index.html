<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>FunBite — Bite-Sized Internet Fun</title>
<meta name="description" content="FunBite — tiny games and toys you can finish before your coffee gets cold.">
<link rel="icon" type="image/png" href="./apple-touch-icon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #FFFFFF;
    --ink: #15131F;
    --ink-soft: rgba(21,19,31,.62);
    --purple: #6C3EF4;
    --purple-soft: #ECE6FF;
    --line: rgba(21,19,31,.08);
  }

  *{ box-sizing: border-box; }
  html{ -webkit-text-size-adjust: 100%; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', system-ui, sans-serif;
    line-height: 1.5;
    overflow-x: hidden;
  }
  h1, h2, h3{ font-family: 'Baloo 2', ui-rounded, sans-serif; margin: 0; }
  a{ color: inherit; }
  img{ display: block; }

  /* ---------- hero ---------- */
  .hero{
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 24px 20px;
    text-align: center;
  }
  .hero img{
    width: min(340px, 78%);
    margin: 0 auto;
  }
  .hero p{
    max-width: 420px;
    margin: 18px auto 0;
    color: var(--ink-soft);
    font-size: 16px;
  }

  /* ---------- games stack ---------- */
  .section-label{
    max-width: 640px;
    margin: 6px auto 0;
    padding: 0 24px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .stack{
    max-width: 640px;
    margin: 14px auto 0;
    padding: 0 20px 60px;
    display: grid;
    gap: 22px;
  }

  .banner{
    position: relative;
    display: block;
    text-decoration: none;
    aspect-ratio: 16 / 11;
    border-radius: 28px;
    overflow: hidden;
    isolation: isolate;
    border: 4px solid var(--border, var(--ink));
    box-shadow: 0 12px 26px -14px rgba(21,19,31,.35);
    background: var(--bg-art, var(--purple));
    opacity: 0;
    transform: translateY(14px);
    animation: fadeUp .5s ease forwards;
    animation-delay: calc(var(--i, 0) * 100ms);
    transition: transform .18s ease;
  }
  .banner:active{ transform: translateY(2px) scale(.99); }
  @keyframes fadeUp{ to{ opacity: 1; transform: translateY(0); } }

  .banner:focus-visible{
    outline: 3px solid var(--purple);
    outline-offset: 3px;
  }

  .deco{
    position: absolute;
    font-size: 42px;
    opacity: .38;
    transform: rotate(var(--r, 0deg));
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.15));
    pointer-events: none;
    line-height: 1;
    z-index: 0;
  }

  .hero-icon{
    position: absolute;
    top: 16%;
    left: 50%;
    transform: translateX(-50%) rotate(-4deg);
    font-size: clamp(52px, 15vw, 76px);
    z-index: 1;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,.2));
  }

  .scrim{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 58%;
    background: linear-gradient(to top, rgba(10,8,20,.78), rgba(10,8,20,0));
    z-index: 1;
  }

  .banner-copy{
    position: absolute;
    left: 20px; right: 20px; bottom: 16px;
    z-index: 2;
  }
  .banner-copy h3{
    color: #fff;
    font-size: clamp(20px, 5.6vw, 26px);
    font-weight: 800;
    letter-spacing: -.01em;
  }
  .banner-copy p{
    margin: 5px 0 0;
    color: rgba(255,255,255,.85);
    font-size: 14px;
  }
  .tag{
    position: absolute;
    top: 16px; right: 16px;
    z-index: 2;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .03em;
    color: #fff;
    background: rgba(0,0,0,.28);
    padding: 6px 12px;
    border-radius: 999px;
    backdrop-filter: blur(3px);
  }

  .banner.soon{
    border: 4px dashed rgba(21,19,31,.25);
    background: #F4F3F7;
    box-shadow: none;
  }
  .banner.soon .hero-icon{ opacity: .3; filter: grayscale(1); }
  .banner.soon .deco{ opacity: .18; filter: grayscale(1); }
  .banner.soon .scrim{ background: linear-gradient(to top, rgba(21,19,31,.35), rgba(21,19,31,0)); }
  .banner.soon .banner-copy h3{ color: var(--ink); }
  .banner.soon .banner-copy p{ color: var(--ink-soft); }
  .banner.soon .tag{ color: var(--ink); background: rgba(21,19,31,.08); }

  /* ---------- footer ---------- */
  footer{
    max-width: 560px;
    margin: 0 auto;
    padding: 6px 24px 50px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
  }
  footer p{ margin: 4px 0; }

  @media (prefers-reduced-motion: reduce){
    .banner{ animation: none; opacity: 1; transform: none; }
  }
</style>
</head>

    <p id="year"></p>
  </footer>

<script>
  // Add new games here. Only title, desc and link are required —
  // everything else (colors, decorations) can be left out and a theme
  // will be picked automatically.
  const games = [
    {
      icon: '💰',
      title: 'Spend Billionaire Money',
      desc: 'Spend billions on mansions, cars, and rockets!',
      link: './spend-money/',
      soon: false,
      decor: ['🏎️', '🏝️', '💎'],
      colors: ['#FFD966', '#FFB13D', '#8A5A00']
    },
    {
      icon: '⚡',
      title: 'DASH RUNNER',
      desc: 'Sprint, dodge obstacles, and run infinitely!',
      link: './dash-runner/',
      soon: false,
      decor: ['🏃', '💨', '🔥'],
      colors: ['#57D9FF', '#2F6BFF', '#123B8F']
    }
  ];

  // Fallback theme palette, used automatically when a game
  // doesn't specify its own "colors".
  const autoThemes = [
    ['#FF8FB4', '#FF4D8D', '#8A0F42'],
    ['#8CF2C4', '#22B37A', '#0B5C36'],
    ['#C9A7FF', '#6C3EF4', '#2E1A80'],
    ['#FFE08A', '#FF9F1C', '#8A4B00']
  ];

  const deco = ['✨', '🎮', '⭐'];
  const stack = document.getElementById('stack');

  games.forEach((game, i) => {
    const [c1, c2, border] = game.colors || autoThemes[i % autoThemes.length];
    const decorEmojis = game.decor || deco;

    const el = document.createElement(game.soon ? 'div' : 'a');
    el.className = 'banner' + (game.soon ? ' soon' : '');
    el.style.setProperty('--i', i);

    if (!game.soon) {
      el.href = game.link;
      el.style.setProperty('--bg-art', `linear-gradient(135deg, ${c1}, ${c2})`);
      el.style.setProperty('--border', border);
    } else {
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.setAttribute('aria-disabled', 'true');
    }

    const decoSpans = decorEmojis.map((e, idx) => {
      const positions = [
        'top:12%; left:8%;',
        'top:8%; right:10%;',
        'bottom:46%; left:14%;'
      ];
      const rotations = [-18, 14, -8];
      return `<span class="deco" style="${positions[idx % positions.length]} --r:${rotations[idx % rotations.length]}deg">${e}</span>`;
    }).join('');

    el.innerHTML = `
      ${decoSpans}
      <span class="hero-icon">${game.icon}</span>
      <span class="scrim" aria-hidden="true"></span>
      <span class="tag">${game.soon ? 'Coming soon' : 'Tap to play →'}</span>
      <div class="banner-copy">
        <h3>${game.title}</h3>
        <p>${game.desc}</p>
      </div>
    `;

    stack.appendChild(el);
  });

  document.getElementById('year').textContent = '© ' + new Date().getFullYear() + ' FunBite';
</script>
