<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Dash Runner — by FunBite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
<style>
  :root{
    --gold:#F0B93D;
    --green:#22C577;
    --red:#E8564A;
    --ink:#0E0D12;
    --panel:#17151F;
    --text:#F3F1EC;
    --muted:#9490A0;
    --line:#2A2733;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;overscroll-behavior:none;overflow:hidden;}
  body{background:var(--ink);color:var(--text);font-family:'Manrope',sans-serif;}

  .stage-wrap{position:fixed;inset:0;overflow:hidden;background:#000;}
  #gameCanvas{display:block;width:100%;height:100%;}

  .hud-overlay{
    position:absolute;top:0;left:0;right:0;z-index:4;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:calc(12px + env(safe-area-inset-top)) 16px 0;
    pointer-events:none;
  }
  .hud-overlay > *{pointer-events:auto;}
  .hud-score{
    background:linear-gradient(180deg,rgba(30,27,40,.7),rgba(14,13,18,.6));
    backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);
    border-radius:12px;padding:8px 14px;font-family:'JetBrains Mono',monospace;font-weight:700;
    box-shadow:0 4px 14px -6px rgba(0,0,0,.5);
  }
  .hud-score .big{font-size:1.35rem;color:var(--gold);display:block;text-shadow:0 2px 8px rgba(240,185,61,.3);}
  .hud-score .lbl{font-size:.6rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
  .hud-right{display:flex;align-items:center;gap:8px;}
  .hud-best{
    background:linear-gradient(180deg,rgba(30,27,40,.7),rgba(14,13,18,.6));
    backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);
    border-radius:12px;padding:8px 14px;text-align:right;font-family:'JetBrains Mono',monospace;
    box-shadow:0 4px 14px -6px rgba(0,0,0,.5);
  }
  .hud-best .lbl{font-size:.6rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
  .hud-best .val{font-size:1rem;color:var(--text);font-weight:700;display:block;}
  .mute-btn{
    background:linear-gradient(180deg,rgba(30,27,40,.7),rgba(14,13,18,.6));
    backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);color:var(--text);
    width:38px;height:38px;border-radius:12px;font-size:1.1rem;cursor:pointer;
    box-shadow:0 4px 14px -6px rgba(0,0,0,.5);
  }
  .fps-badge{
    position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;z-index:4;
    font-family:'JetBrains Mono',monospace;font-size:.62rem;color:rgba(255,255,255,.35);
    pointer-events:none;
  }
  .powerup-strip{
    position:absolute;top:60px;right:16px;z-index:4;display:flex;flex-direction:column;gap:6px;
    pointer-events:none;
  }
  .powerup-chip{
    display:flex;align-items:center;gap:6px;
    background:rgba(14,13,18,.6);backdrop-filter:blur(6px);border-radius:10px;
    padding:5px 10px 5px 6px;font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;
    opacity:0;transform:translateX(20px);transition:opacity .2s,transform .2s;
  }
  .powerup-chip.show{opacity:1;transform:translateX(0);}
  .powerup-chip .bar{width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;}
  .powerup-chip .bar-fill{height:100%;background:var(--gold);transition:width .1s linear;}

  .mission-list{margin-top:8px;text-align:left;}
  .mission-list-title{display:flex;align-items:center;gap:5px;font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;font-family:'Manrope',sans-serif;font-weight:700;}
  .mission-row{
    display:flex;align-items:center;gap:7px;
    background:var(--ink);border:1px solid var(--line);border-radius:7px;
    padding:5px 9px;margin-bottom:4px;font-size:.66rem;
  }
  .mission-row.done{border-color:var(--green);opacity:.6;}
  .mission-check{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.52rem;}
  .mission-row.done .mission-check{background:var(--green);border-color:var(--green);color:#0a2415;}
  .mission-text{flex:1;text-align:left;}
  .mission-reward{color:var(--gold);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.62rem;}

  .overlay{
    position:absolute;inset:0;background:rgba(10,9,14,.82);
    display:flex;align-items:center;justify-content:center;padding:20px;
    backdrop-filter:blur(3px);z-index:6;
  }
  .overlay-card{
    background:linear-gradient(165deg,#1D1B27 0%,var(--panel) 55%,#131118 100%);
    border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:22px 20px;
    text-align:center;max-width:340px;width:100%;
    box-shadow:0 28px 60px -18px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06);
    max-height:94vh;overflow-y:auto;
  }
  .overlay-emoji{font-size:2.8rem;margin-bottom:4px;filter:drop-shadow(0 4px 10px rgba(240,185,61,.3));}
  .overlay-title{
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.3rem,7vw,1.65rem);
    background:linear-gradient(180deg,#FFF6DE,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:.01em;line-height:1.1;
  }
  .overlay-sub{color:var(--muted);font-size:.8rem;margin-top:4px;line-height:1.4;font-family:'Manrope',sans-serif;font-weight:500;}
  .overlay-score{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:2.2rem;color:var(--gold);margin-top:10px;text-shadow:0 2px 12px rgba(240,185,61,.35);}
  .overlay-stats{display:flex;justify-content:center;gap:18px;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);}
  .overlay-btn{
    margin-top:10px;background:linear-gradient(180deg,#FFDD7A,var(--gold) 60%,#D89B22);
    color:#241705;border:none;border-bottom:3px solid #A87A17;
    padding:12px 28px;border-radius:12px;font-weight:800;font-size:.95rem;cursor:pointer;
    text-transform:uppercase;letter-spacing:.02em;width:100%;
    transition:transform .1s, box-shadow .15s;
    box-shadow:0 6px 16px -4px rgba(240,185,61,.5);
  }
  .overlay-btn:active{transform:translateY(2px) scale(.98);box-shadow:0 2px 6px -2px rgba(240,185,61,.4);}
  .overlay-btn.secondary{background:rgba(255,255,255,.04);border:1.5px solid var(--line);border-bottom:1.5px solid var(--line);color:var(--text);box-shadow:none;}
  .btn-icon{display:inline-block;margin-right:4px;}

  .menu-card{padding-top:16px;}

  /* Publisher lockup — brand credit for FunBite, shown above the game logo */
  .publisher-tag{
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-family:'Manrope',sans-serif;font-weight:700;font-size:.6rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    margin-bottom:8px;
  }
  .pub-dot{width:5px;height:5px;border-radius:2px;background:var(--gold);box-shadow:0 0 8px rgba(240,185,61,.85);transform:rotate(45deg);flex-shrink:0;}

  /* Logo lockup — character medallion beside the wordmark, side-by-side to
     save vertical space instead of stacking hero art above the title */
  .logo-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px;}
  .hero-medallion{
    position:relative;flex-shrink:0;width:clamp(58px,18vh,76px);height:clamp(58px,18vh,76px);
    border-radius:16px;overflow:hidden;
    background:radial-gradient(ellipse at 50% 30%, rgba(240,185,61,.22), transparent 65%),
               linear-gradient(155deg,#2A2637,#151320);
    border:1px solid rgba(240,185,61,.35);
    box-shadow:0 10px 22px -10px rgba(240,185,61,.35), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .hero-medallion .deco-coin{
    position:absolute;top:3px;right:2px;font-size:.72rem;opacity:.55;transform:rotate(12deg);
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
  }
  #heroCanvas{width:100%;height:100%;}
  .logo-text{text-align:left;}
  .game-logo{
    font-family:'Fredoka',sans-serif;font-weight:800;font-size:clamp(1.3rem,7.5vw,1.6rem);
    line-height:.92;letter-spacing:.01em;
    background:linear-gradient(180deg,#FFF6DE,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 14px rgba(240,185,61,.22);
  }
  .game-logo .sub-word{
    display:block;font-size:.58em;color:var(--text);-webkit-text-fill-color:var(--text);
    letter-spacing:.2em;font-weight:700;margin-top:1px;
  }
  .logo-tagline{font-size:.58rem;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-top:4px;font-weight:600;}

  .control-hints{display:flex;justify-content:center;gap:14px;margin:8px 0 2px;}
  .hint-chip{
    display:flex;align-items:center;gap:4px;
    font-size:.62rem;color:var(--muted);
    font-family:'Manrope',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.03em;
  }
  .hint-icon{font-size:.85rem;color:var(--text);}

  .wallet-pill{
    display:inline-flex;align-items:center;gap:5px;
    background:linear-gradient(180deg,rgba(240,185,61,.18),rgba(240,185,61,.08));
    border:1px solid rgba(240,185,61,.4);
    color:var(--gold);font-family:'JetBrains Mono',monospace;font-weight:700;
    padding:5px 14px;border-radius:20px;font-size:.82rem;margin-top:6px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
  }
  .wallet-icon{font-size:.9rem;}
  .wallet-lbl{font-family:'Manrope',sans-serif;font-weight:600;font-size:.64rem;color:rgba(240,185,61,.7);text-transform:uppercase;letter-spacing:.03em;margin-left:2px;}

  .menu-footer{
    margin-top:10px;font-size:.56rem;color:var(--muted);opacity:.65;
    letter-spacing:.05em;text-transform:uppercase;font-weight:600;
    font-family:'Manrope',sans-serif;
  }

  /* STORE SCREEN */
  .store-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .store-back{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:4px 8px;}
  .store-title{font-family:'Fredoka',sans-serif;font-weight:800;font-size:1.3rem;text-transform:uppercase;}
  .store-tabs{display:flex;gap:6px;margin-bottom:14px;}
  .store-tab{
    flex:1;background:var(--ink);border:1px solid var(--line);color:var(--muted);
    padding:8px;border-radius:8px;font-size:.75rem;font-weight:700;cursor:pointer;
    text-transform:uppercase;letter-spacing:.02em;
  }
  .store-tab.active{color:var(--text);border-color:var(--gold);background:rgba(240,185,61,.1);}
  .store-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;}
  .store-item{
    background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);
    border:1.5px solid var(--line);border-radius:14px;padding:12px;
    display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;
    transition:.15s;
  }
  .store-item.equipped{border-color:var(--green);box-shadow:0 0 0 1px rgba(34,197,119,.25);}
  .store-swatch{
    width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;
    box-shadow:inset 0 2px 4px rgba(255,255,255,.25), inset 0 -3px 6px rgba(0,0,0,.25), 0 3px 8px -2px rgba(0,0,0,.4);
  }
  .store-preview{
    width:64px;height:64px;border-radius:12px;
    background:radial-gradient(ellipse at 50% 70%, rgba(255,255,255,.06), transparent 70%);
    display:flex;align-items:center;justify-content:center;
  }
  .preview-canvas{width:64px;height:64px;}
  .store-item-name{font-size:.78rem;font-weight:700;}
  .store-item-desc{font-size:.62rem;color:var(--muted);line-height:1.3;min-height:22px;}
  .store-item-btn{
    width:100%;background:linear-gradient(180deg,#FFDD7A,var(--gold));color:#241705;border:none;
    border-bottom:2px solid #A87A17;padding:7px;border-radius:8px;
    font-size:.72rem;font-weight:800;cursor:pointer;text-transform:uppercase;
  }
  .store-item-btn.owned{background:var(--line);border-bottom-color:var(--line);color:var(--muted);cursor:default;}
  .store-item-btn.equipped-btn{background:linear-gradient(180deg,#4EDB98,var(--green));border-bottom-color:#0d5c39;color:#0a2415;}
  .store-item-btn:disabled{opacity:.5;cursor:not-allowed;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important;} }

  /* 3D CONVERSION: floating score/mission popups and the biome banner now live in the
     DOM (projected from 3D world space) instead of being drawn as canvas text — simpler
     and crisper than trying to render 2D text over a WebGL scene. */
  .popup-layer{ position:absolute; inset:0; pointer-events:none; z-index:5; overflow:hidden; }
  .popup-item{
    position:absolute; transform:translate(-50%,-50%);
    font-family:'JetBrains Mono',monospace; font-weight:800; font-size:1rem; color:var(--gold);
    text-shadow:0 2px 8px rgba(0,0,0,.6); white-space:nowrap; will-change:transform,opacity;
    animation:popupFloat .85s ease-out forwards;
  }
  @keyframes popupFloat{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.7); }
    15%{ opacity:1; transform:translate(-50%,-50%) scale(1.05); }
    100%{ opacity:0; transform:translate(-50%,-160%) scale(1); }
  }
  .biome-banner{
    position:absolute; top:calc(60px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    background:rgba(10,9,14,.45); backdrop-filter:blur(6px); color:#fff; font-weight:700; font-size:.8rem;
    padding:7px 18px; border-radius:14px; opacity:0; pointer-events:none; z-index:5;
    font-family:'Manrope',sans-serif; letter-spacing:.02em;
    transition:opacity .4s ease, transform .4s ease;
  }
  .biome-banner.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .three-error{
    position:absolute; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:#0E0D12; color:#F3F1EC; text-align:center; padding:40px 26px;
    font-family:'Manrope',sans-serif; line-height:1.6;
  }
  .hit-flash{
    position:absolute; inset:0; z-index:4; background:#c8281e; opacity:0; pointer-events:none;
  }
</style>
</head>
<body>

<div class="stage-wrap" id="stageWrap">
  <canvas id="gameCanvas"></canvas>
  <div class="popup-layer" id="popupLayer"></div>
  <div class="biome-banner" id="biomeBannerEl"></div>
  <div class="hit-flash" id="hitFlash"></div>
  <div class="three-error" id="threeError">
    <div>
      <div style="font-size:2rem;margin-bottom:10px;">⚠️</div>
      <div style="font-weight:700;margin-bottom:6px;">3D couldn't load</div>
      <div style="font-size:.85rem;color:var(--muted);">Check your internet connection and reload the page.</div>
    </div>
  </div>

  <div class="hud-overlay">
    <div class="hud-score"><span class="lbl">Score</span><span class="big" id="scoreVal">0</span></div>
    <div class="hud-right">
      <div class="hud-best"><span class="lbl">Best</span><span class="val" id="bestVal">0</span></div>
      <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
    </div>
  </div>

  <div class="powerup-strip" id="powerupStrip"></div>

  <div class="overlay" id="reviveOverlay" style="display:none;">
    <div class="overlay-card">
      <div class="overlay-emoji">💥</div>
      <div class="overlay-title">Busted!</div>
      <p class="overlay-sub">Keep the run going?</p>
      <div class="overlay-score" id="reviveScoreVal">0</div>
      <button class="overlay-btn" onclick="doRevive()" id="reviveBtn">🪙 Revive (30 coins)</button>
      <button class="overlay-btn secondary" onclick="declineRevive()">No thanks</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="overlay-card menu-card">
      <div class="publisher-tag"><span class="pub-dot"></span>FunBite Presents</div>

      <div class="logo-row">
        <div class="hero-medallion">
          <span class="deco-coin">🪙</span>
          <canvas id="heroCanvas" width="140" height="140"></canvas>
        </div>
        <div class="logo-text">
          <h1 class="game-logo">DASH<span class="sub-word">RUNNER</span></h1>
          <div class="logo-tagline">Endless Coin Chase</div>
        </div>
      </div>

      <div class="overlay-title" id="overlayTitle">Ready to run?</div>
      <p class="overlay-sub" id="overlaySub">Dodge crates and slide under bars.</p>

      <div class="wallet-pill">
        <span class="wallet-icon">🪙</span>
        <span id="walletVal">0</span>
        <span class="wallet-lbl">coins</span>
      </div>

      <button class="overlay-btn" onclick="startGame()" id="overlayBtn">
        <span class="btn-icon">▶</span> Start Run
      </button>
      <button class="overlay-btn secondary" onclick="openStore()" id="storeOpenBtn">
        <span class="btn-icon">🛒</span> Store
      </button>

      <div class="control-hints">
        <div class="hint-chip"><span class="hint-icon">⟷</span><span>Move</span></div>
        <div class="hint-chip"><span class="hint-icon">⤒</span><span>Jump</span></div>
        <div class="hint-chip"><span class="hint-icon">⤓</span><span>Slide</span></div>
      </div>

      <div class="mission-list">
        <div class="mission-list-title"><span>🎯</span> Today's Missions</div>
        <div id="missionRows"></div>
      </div>

      <div class="menu-footer">A FunBite Original</div>
    </div>
  </div>

  <div class="overlay" id="storeOverlay" style="display:none;">
    <div class="overlay-card">
      <div class="store-header">
        <button class="store-back" onclick="closeStore()">←</button>
        <div class="store-title">Store</div>
        <div class="wallet-pill" style="margin:0;">🪙 <span id="walletValStore">0</span></div>
      </div>
      <div class="store-tabs">
        <button class="store-tab active" id="tabSkins" onclick="switchStoreTab('skins')">Skins</button>
        <button class="store-tab" id="tabPowerups" onclick="switchStoreTab('powerups')">Power-ups</button>
      </div>
      <div class="store-grid" id="storeGrid"></div>
    </div>
  </div>

  <div class="fps-badge" id="fpsBadge"></div>
</div>

<script>
/* =========================================================================
   DASH RUNNER — original 3-lane endless runner (published by FunBite)
   Built with: delta-time movement (device-independent speed), matched
   visual/hitbox collision, object pooling/cleanup, run power-up pickups,
   parallax layers, synthesized audio.
   ========================================================================= */

/* ---------- AUDIO ---------- */
let audioCtx, muted = false;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type, delay, peak){
  if(muted) return;
  try{
    const ctx = getCtx();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type||'sine'; osc.frequency.value = freq;
    const t0 = ctx.currentTime + (delay||0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(peak||0.15, t0+0.012);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(e){}
}
function sndCoin(pitchUp, combo){
  const bump = Math.min(500, (combo||0)*35);
  tone((pitchUp?1600:1300)+bump, 0.09, 'square', 0, 0.08);
}
function sndJump(){
  if(muted) return;
  try{
    const c = getCtx();
    const osc = c.createOscillator(), gain = c.createGain();
    osc.type = 'square';
    const t0 = c.currentTime;
    osc.frequency.setValueAtTime(430,t0);
    osc.frequency.exponentialRampToValueAtTime(950,t0+0.08);
    gain.gain.setValueAtTime(0,t0);
    gain.gain.linearRampToValueAtTime(0.13,t0+0.008);
    gain.gain.exponentialRampToValueAtTime(0.001,t0+0.1);
    osc.connect(gain).connect(c.destination);
    osc.start(t0); osc.stop(t0+0.11);
  }catch(e){}
}
function sndSlide(){
  if(muted) return;
  try{
    const c = getCtx();
    const osc = c.createOscillator(), gain = c.createGain();
    osc.type = 'triangle';
    const t0 = c.currentTime;
    osc.frequency.setValueAtTime(520,t0);
    osc.frequency.exponentialRampToValueAtTime(150,t0+0.09);
    gain.gain.setValueAtTime(0,t0);
    gain.gain.linearRampToValueAtTime(0.11,t0+0.008);
    gain.gain.exponentialRampToValueAtTime(0.001,t0+0.11);
    osc.connect(gain).connect(c.destination);
    osc.start(t0); osc.stop(t0+0.12);
  }catch(e){}
}

/* ---------- RUN MUSIC: bouncy 8-bit style bassline + lead loop (Subway-Surfers-esque
   upbeat arcade energy) instead of an ambient drone. Every note is a short, self-
   cleaning blip like the other sfx — nothing lingers, so there's no background hiss. ---------- */
let beatActive=false, beatAcc=0, seqStep=0;
const BASS_STEPS = [1, 1, 1.5, 1, 1.334, 1, 1.5, 1.782];   // root-heavy bouncing bass riff
const LEAD_STEPS = [0, 2, 0, 1.5, 2, 0, 2.52, 2];          // 0 = rest; bright hook on top

function tickMusic(dt, speedPxPerSec){
  const stepDur = Math.max(0.155, 0.215 - (speedPxPerSec/430)*0.05);
  beatAcc += dt;
  while(beatAcc >= stepDur){
    beatAcc -= stepDur;
    const theme = THEMES[currentThemeIndex()];
    const root = theme.musicRoot;
    tone(root*0.5*BASS_STEPS[seqStep % BASS_STEPS.length], stepDur*0.8, 'triangle', 0, 0.05);
    const leadRatio = LEAD_STEPS[seqStep % LEAD_STEPS.length];
    if(leadRatio>0) tone(root*leadRatio, stepDur*0.42, 'square', 0.01, 0.028);
    seqStep++;
  }
}

function startBeat(){ beatActive = true; beatAcc = 0; seqStep = 0; }
function stopBeat(){ beatActive = false; }
function toggleMute(){
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
  if(!muted) sndClick();
}

/* ---------- 3D SCENE / CAMERA / RENDERER ----------
   The game's simulation (lanes 0/1/2, an abstract "distance travelled" scroll value,
   jump height, etc.) stays exactly as it was. laneX() and worldZ() are the only two
   functions that translate those abstract numbers into real 3D world-space coordinates,
   so spawning/scoring/collision logic below is almost entirely unchanged from the 2D version. */
const canvas = document.getElementById('gameCanvas');
let W,H,DPR=1;
let scene, camera, renderer, threeReady=false;
let hemiLight, sunLight, ambLight;

const LANE_GAP   = 1.9;    // world-space distance between lane centers
const GROUND_Y   = 600;    // abstract "collision line" scroll value (unitless, same role the old pixel-based groundY played)
const DESPAWN_Y  = GROUND_Y + 400; // scroll value at which a passed object is safely behind the camera and gets cleaned up
const Z_SCALE    = 0.024;  // abstract scroll units -> world Z depth
const Y_SCALE    = 1/32;   // old jump-height pixel units -> world Y height
const CAM_HEIGHT = 3.9, CAM_BACK = 6.4, CAM_LOOK_Y = 1.35, CAM_LOOK_AHEAD = -17;

function laneX(l){ return (l-1)*LANE_GAP; }
function worldZ(scrollY){ return (scrollY - GROUND_Y) * Z_SCALE; }

/* ---------- CHANGEABLE BIOMES (Subway-Surfers style world rotation) ----------
   The run cycles through these worlds as distance builds. Scenery props are recycled
   continuously (see initSceneryPools/recycleProp below) and each newly-recycled prop
   just picks up whatever theme corresponds to its spawn point, so the world transitions
   gradually as you travel instead of needing an expensive full-scene swap. Sky/fog/light
   colors lerp smoothly frame-to-frame using the same blend window. */
const THEME_SEG_LEN = 5000; // distance covered before the next biome takes over
const TRANS_LEN = 900;      // blend length at the end of each segment

const THEMES = [
  { name:'Day City', propType:'building',
    sky:0x8fcbe8, fogColor:0x9fd0df, fogNear:16, fogFar:66,
    groundColor:0x8c7a54, laneLineColor:0xf3ecd8,
    propColor:0x716a90, propColor2:0x554e78, windowColor:0xffd98c,
    sunColor:0xfff3c8, hemiSky:0xbfe3e0, hemiGround:0x6e5f41, hemiIntensity:1.0, dirIntensity:1.05,
    stars:false, snow:false, musicRoot:220 },
  { name:'Sunset Strip', propType:'building',
    sky:0xffa478, fogColor:0xffb98c, fogNear:15, fogFar:60,
    groundColor:0xb97650, laneLineColor:0xffe3c8,
    propColor:0x8a4f68, propColor2:0x6a3850, windowColor:0xffcf8c,
    sunColor:0xffcf9c, hemiSky:0xffc98b, hemiGround:0x6e4030, hemiIntensity:1.05, dirIntensity:1.1,
    stars:false, snow:false, musicRoot:196 },

    sky:0x18234f, fogColor:0x1c2a55, fogNear:12, fogFar:52,
    groundColor:0x2a2c45, laneLineColor:0x8ea3ff,
    propColor:0x33345c, propColor2:0x22233f, windowColor:0x8adcff,
    sunColor:0xdce1ff, hemiSky:0x3a4a8f, hemiGround:0x14152a, hemiIntensity:0.55, dirIntensity:0.35,
    stars:true, snow:false, musicRoot:174 },
  { name:'Beach Coast', propType:'palm',
    sky:0x8fe1f0, fogColor:0xbdeee8, fogNear:16, fogFar:64,
    groundColor:0xead9a0, laneLineColor:0xffffff,
    propColor:0x2f7d6e, propColor2:0xc9a863, windowColor:0xffffff,
    sunColor:0xfff9d2, hemiSky:0xbff0ea, hemiGround:0xc9a863, hemiIntensity:1.05, dirIntensity:1.1,
    stars:false, snow:false, musicRoot:246 },
  { name:'Snow Peaks', propType:'mountain',
    sky:0xcfe9f5, fogColor:0xe6f3fa, fogNear:14, fogFar:58,
    groundColor:0xf3f7fa, laneLineColor:0x7d93b0,
    propColor:0x8ea0c2, propColor2:0x3f6146, windowColor:0xffffff,
    sunColor:0xffffff, hemiSky:0xdceff7, hemiGround:0xc9d6e0, hemiIntensity:1.1, dirIntensity:1.0,
    stars:false, snow:true, musicRoot:262 },
];

function getThemeBlend(distNow){
  const idx = Math.floor(distNow/THEME_SEG_LEN);
  const pos = distNow - idx*THEME_SEG_LEN;
  const n = THEMES.length;
  const themeA = THEMES[((idx%n)+n)%n];
  const themeB = THEMES[(((idx+1)%n)+n)%n];
  let t = 0;
  if(pos > THEME_SEG_LEN-TRANS_LEN) t = (pos-(THEME_SEG_LEN-TRANS_LEN))/TRANS_LEN;
  return {themeA, themeB, t};
}
function currentThemeIndex(distArg){
  const d = distArg!==undefined ? distArg : distance;
  const n = THEMES.length;
  const idx = Math.floor(d/THEME_SEG_LEN);
  const pos = d - idx*THEME_SEG_LEN;
  // switch identity mid-blend (not at the segment midpoint) so audio/banner line up with what's on screen
  const i = pos > THEME_SEG_LEN - TRANS_LEN/2 ? idx+1 : idx;
  return ((i%n)+n)%n;
}
function themeForScroll(propY, distNow){ const futureDist = Math.max(0, (distNow!==undefined?distNow:distance) + (propY - GROUND_Y)); return THEMES[currentThemeIndex(futureDist)]; }

/* ---------- 3D SCENERY POOLS ----------
   Buildings/mountains/palms/pines are pooled objects that scroll toward the camera
   exactly like obstacles/coins do (same o.y-style scroll value). Once a prop passes
   the camera it's recycled to a fresh far spawn point and rebuilt using whatever theme
   belongs at that new point, so the world's look phases in gradually as you travel. */
let sceneryFar=[], sceneryMid=[], laneDashes=[], starPoints=null, snowPoints=null, sunSprite=null;

function disposeGroup(group){
  while(group.children.length){
    const c = group.children.pop();
    if(c.geometry) c.geometry.dispose();
    if(c.material) c.material.dispose();
  }
}

// removes+disposes the .mesh attached to a spawned obstacle/coin/pickup game object
function disposeObj(obj){
  if(!obj || !obj.mesh) return;
  const m = obj.mesh;
  if(m.children && m.children.length) disposeGroup(m);
  if(m.geometry) m.geometry.dispose();
  if(m.material){ if(m.material.map) m.material.map.dispose(); m.material.dispose(); }
  if(scene) scene.remove(m);
  obj.mesh = null;
}

function buildFarProp(group, theme, seed){
  disposeGroup(group);
  const c1 = theme.propColor;
  if(theme.propType==='mountain'){
    const h=5.5+seed*4.5, r=2.6+seed*1.6;
    const m = new THREE.Mesh(new THREE.ConeGeometry(r,h,5), new THREE.MeshLambertMaterial({color:c1}));
    m.position.y = h/2; m.rotation.y = seed*Math.PI;
    group.add(m);
  } else if(theme.propType==='palm'){
    const trunkH = 3+seed*1.6;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.2,trunkH,6), new THREE.MeshLambertMaterial({color:0x6b4a2c}));
    trunk.position.y = trunkH/2; group.add(trunk);
    for(let i=0;i<5;i++){
      const frond = new THREE.Mesh(new THREE.ConeGeometry(0.85,1.7,4), new THREE.MeshLambertMaterial({color:c1}));
      frond.position.set(0, trunkH+0.15, 0);
      frond.rotation.z = 1.25; frond.rotation.y = i*(Math.PI*2/5);
      group.add(frond);
    }
  } else {
    const w=1.7+seed*1.3, h=3.2+seed*5.4, d=1.7+seed*1.3;
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshLambertMaterial({color:c1}));
    m.position.y = h/2;
    group.add(m);
  }
}
function buildMidProp(group, theme, seed){
  disposeGroup(group);
  const c1 = theme.propColor2;
  if(theme.propType==='mountain'){
    let h=1.5+seed*0.9, base=h;
    for(let i=0;i<3;i++){
      const segH = h*(1-i*0.28);
      const cone = new THREE.Mesh(new THREE.ConeGeometry(0.55-i*0.1, segH, 6), new THREE.MeshLambertMaterial({color:c1}));
      cone.position.y = i*segH*0.32 + segH/2;
      group.add(cone);
    }
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.08,0.25,5), new THREE.MeshLambertMaterial({color:0x5a3c1e}));
    trunk.position.y = 0.1; group.add(trunk);
  } else if(theme.propType==='palm'){
    const poleH = 1.5;
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,poleH,6), new THREE.MeshLambertMaterial({color:0x6b4a2c}));
    pole.position.y = poleH/2; group.add(pole);
    const cap = new THREE.Mesh(new THREE.ConeGeometry(0.85,0.55,10,1,true), new THREE.MeshLambertMaterial({color:c1, side:THREE.DoubleSide}));
    cap.position.y = poleH+0.1; group.add(cap);
  } else {
    const w=0.9+seed*0.8, h=1.6+seed*2.6, d=0.9+seed*0.8;
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshLambertMaterial({color:c1}));
    m.position.y = h/2; group.add(m);
    if(theme.windowColor){
      const winMat = new THREE.MeshBasicMaterial({color:theme.windowColor});
      const rows = Math.max(1,Math.floor(h/0.5)), cols = Math.max(1,Math.floor(w/0.35));
      for(let r=0;r<rows;r++) for(let cIdx=0;cIdx<cols;cIdx++){
        if(Math.random()<0.4) continue;
        const win = new THREE.Mesh(new THREE.PlaneGeometry(0.14,0.2), winMat);
        win.position.set(-w/2+0.2+cIdx*0.32, 0.35+r*0.5, d/2+0.01);
        group.add(win);
        const win2 = win.clone();
        win2.position.z = -d/2-0.01; win2.rotation.y = Math.PI;
        group.add(win2);
      }
    }
  }
}

function initSceneryPools(){
  sceneryFar.forEach(p=>scene.remove(p.mesh));
  sceneryMid.forEach(p=>scene.remove(p.mesh));
  laneDashes.forEach(p=>scene.remove(p.mesh));
  sceneryFar = []; sceneryMid = []; laneDashes = [];
  const FAR_N=10, MID_N=14, DASH_N=24;
  for(let i=0;i<FAR_N;i++){
    const grp = new THREE.Group(); scene.add(grp);
    const y = -300 - i*(2600/FAR_N) - Math.random()*180;
    const side = i%2===0?-1:1, seed = 0.5+Math.random()*0.6;
    buildFarProp(grp, themeForScroll(y), seed);
    sceneryFar.push({mesh:grp, side, y, seed, xOff:6.5+Math.random()*3.2});
  }
  for(let i=0;i<MID_N;i++){
    const grp = new THREE.Group(); scene.add(grp);

    const side = i%2===0?-1:1, seed = 0.4+Math.random()*0.7;

/* ---------- REAL ANIMATED MODELS (GLTFLoader + AnimationMixer) ----------
   No local files: everything below streams over the network. The player is three.js's
   own official "Soldier" sample (CORS-safe via jsdelivr). The chasers — an actual police
   girl and her pet cat — are custom .glb files self-hosted by FunBite (there's no free,
   stable, hotlink-able "police girl"/"cat" model on any public CDN, so those had to be
   sourced and hosted separately; see MODEL_URLS.policeGirl / MODEL_URLS.cat). */
const MODEL_URLS = {
  // Soldier.glb: threejs.org itself doesn't reliably send cross-origin CORS headers for
  // static assets (that's why "humanoid" was failing), so this pulls from jsdelivr's
  // GitHub CDN instead — jsdelivr always sends Access-Control-Allow-Origin, which is the
  // same domain family already working for the loader script and the fox model. Pinned
  // to a confirmed commit first (immutable, can't ever be renamed/moved), then branch
  // mirrors, then the original threejs.org URL as a last resort.
  humanoid: [
    'https://cdn.jsdelivr.net/gh/mrdoob/three.js@7d2c540b8d0fc67223ad39941c5985c59e300cfe/examples/models/gltf/Soldier.glb',
    'https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/models/gltf/Soldier.glb',
    'https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/examples/models/gltf/Soldier.glb',
    'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Soldier.glb',
    'https://threejs.org/examples/models/gltf/Soldier.glb'
  ],
  // Self-hosted on Vercel. If these ever fail to load, it's almost certainly a CORS
  // header issue on the Vercel side (see the note further down), not a broken URL.
  policeGirl: ['https://funbite.vercel.app/assets/police-girl.glb'],
  cat:        ['https://funbite.vercel.app/assets/cat.glb']
};
const gltfLoader = (typeof THREE !== 'undefined' && THREE.GLTFLoader) ? new THREE.GLTFLoader() : null;

// Loads a URL (or tries a list of candidate URLs in order) once, and caches the
// in-flight/resolved promise by key. Skinned/rigged models are requested again under a
// *different* key when a second, independent instance is needed (e.g. the police chaser
// reusing the runner glb) — glTF scene graphs can only live in one place at a time, so
// each independent character needs its own parse. The browser's HTTP cache makes the
// repeat network request cheap.
const modelCache = {};
function loadModelOnce(key, urlOrList){
  if(!modelCache[key]){
    const urls = Array.isArray(urlOrList) ? urlOrList : [urlOrList];
    modelCache[key] = new Promise((resolve, reject)=>{
      if(!gltfLoader){ reject(new Error('GLTFLoader unavailable')); return; }
      const tryNext = i=>{
        if(i >= urls.length){ reject(new Error('All sources failed for "'+key+'"')); return; }
        gltfLoader.load(urls[i], resolve, undefined, ()=>{
          console.warn('Model source failed for "'+key+'", trying next fallback:', urls[i]);
          tryNext(i+1);
        });
      };
      tryNext(0);
    });
  }
  return modelCache[key];
}

// Scales a loaded model uniformly so its standing height matches targetHeight (meters)
// regardless of the source file's native units, then centers it over its own local
// origin on X/Z and sits it flush on the ground on Y. Downloaded rigged models often
// have an off-center authoring pivot (not centered on the character) — without this,
// scaling amplifies that offset and the character visibly drifts to one side even
// though its lane position is correct.
function fitModelHeight(root, targetHeight){
  let box = new THREE.Box3().setFromObject(root);
  const h = box.max.y - box.min.y;
  if(h > 0) root.scale.setScalar(targetHeight/h);
  box = new THREE.Box3().setFromObject(root);
  const cx = (box.max.x + box.min.x) / 2;
  const cz = (box.max.z + box.min.z) / 2;
  root.position.x -= cx;
  root.position.z -= cz;
  root.position.y -= box.min.y;
}
// Tints every mesh material on a model toward a color (multiplied over its existing
// texture) — an approximation of a full re-skin, since these sample models ship as a
// single baked texture rather than separate swappable clothing materials.
function tintModel(root, hexColor, amount){
  const target = new THREE.Color(hexColor);
  root.traverse(o=>{
    if(o.isMesh && o.material){
      (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
        if(m.color) m.color.copy(new THREE.Color(0xffffff)).lerp(target, amount===undefined?0.55:amount);
      });
    }
  });
}
function findClip(animations, names){
  for(const n of names){ const c = THREE.AnimationClip.findByName(animations, n); if(c) return c; }
  return animations && animations[0];
}

let playerMixer=null, playerRunAction=null, playerModelRoot=null;
let playerModelReady=false, playerModelLoading=false;

function attachPlayerModel(gltf){
  if(charGroup){ scene.remove(charGroup); disposeGroup(charGroup); }
  charGroup = new THREE.Group();

  playerModelRoot = gltf.scene;
  fitModelHeight(playerModelRoot, 1.8);
  charGroup.add(playerModelRoot);
  legL=legR=armL=armR=null; // the clip below drives the running motion now

  playerMixer = new THREE.AnimationMixer(playerModelRoot);
  playerRunAction = playerMixer.clipAction(findClip(gltf.animations, ['Run','Running']));
  playerRunAction.play();

  flameMesh = new THREE.Mesh(new THREE.ConeGeometry(0.14,0.5,8), new THREE.MeshBasicMaterial({color:0xffb03c, transparent:true, opacity:0.85}));
  flameMesh.position.set(0,1.1,0.16);
  flameMesh.rotation.x = Math.PI;
  flameMesh.visible = false;
  charGroup.add(flameMesh);

  charGroup.scale.y = 1;
  scene.add(charGroup);
  ensureShadowMesh();
  applyPlayerSkinTint();
  playerModelReady = true;
}
function ensureShadowMesh(){
  if(shadowMesh) return;
  const cv=document.createElement('canvas'); cv.width=cv.height=64;
  const cx2=cv.getContext('2d');
  const grd=cx2.createRadialGradient(32,32,2,32,32,32);
  grd.addColorStop(0,'rgba(0,0,0,.35)'); grd.addColorStop(1,'rgba(0,0,0,0)');
  cx2.fillStyle=grd; cx2.fillRect(0,0,64,64);
  const tex = new THREE.CanvasTexture(cv);
  shadowMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.75,0.75), new THREE.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false}));
  shadowMesh.rotation.x = -Math.PI/2;
  scene.add(shadowMesh);
}
function applyPlayerSkinTint(){
  if(!playerModelRoot) return;
  const skin = SKINS.find(s=>s.id===equippedSkin) || SKINS[0];
  tintModel(playerModelRoot, skin.color, 0.55);
}

// Orchestrator: shows the built-in low-poly runner immediately (so there's no blank
// gap on first load), then swaps to the real animated model once it streams in. Once
// the model is ready, later calls (e.g. on skin change) just re-tint it in place.
function buildCharacter(){
  if(playerModelReady){ applyPlayerSkinTint(); return; }
  buildCharacterProcedural();
  if(!gltfLoader){ console.warn('GLTFLoader script did not load — staying on the built-in character.'); return; }
  if(playerModelLoading) return;
  playerModelLoading = true;
  loadModelOnce('humanoid', MODEL_URLS.humanoid)
    .then(attachPlayerModel)
    .catch(err=>console.warn('Runner model failed to load, staying on the built-in character.', err));
}

/* ---------- CHASERS (Subway-Surfers-style pursuers) ----------
   Trail at a fixed camera-relative distance behind the player and only ever shift
   lanes, because in this game the world scrolls past a stationary player (see
   laneX()/worldZ() above) rather than the player moving through a static world. */
// NOTE on `gap`: this camera sits high (y=3.9) and looks only slightly downward, so its
// visible frustum barely reaches the ground right behind the player — anything much
// further back than this falls below the bottom edge of the screen and is invisible
// even though it's loaded and positioned correctly. Verified numerically against the
// actual camera transform; keep gap small (roughly under ~30 scroll units) or the
// chasers silently disappear off-frame again.
const CHASER_DEFS = [
  { key:'policeGirl', url:MODEL_URLS.policeGirl, height:1.68, gap:20, tint:null, tintAmt:0, laneSpeed:5.0, rotationY:Math.PI, clipNames:['Run','Running','run','RunCycle','Run_cycle','mixamo.com','Walk','Walking'] },
  { key:'cat',         url:MODEL_URLS.cat,         height:0.42, gap:11, tint:null, tintAmt:0, laneSpeed:3.5, rotationY:0, clipNames:['Run','Running','run','CatRun','RunCycle','Run_cycle','Walk','Walking'] },
];
let chasers = [];
function loadChasers(){
  if(!gltfLoader) return;
  CHASER_DEFS.forEach(def=>{
    const c = { def, group:null, mixer:null, x:0, lane:1, ready:false };
    chasers.push(c);
    loadModelOnce(def.key, def.url).then(gltf=>{
      const root = gltf.scene;
      fitModelHeight(root, def.height);
      root.rotation.y = def.rotationY || 0; // tune this per-model if it ends up facing sideways/backwards
      if(def.tint) tintModel(root, def.tint, def.tintAmt);
      const group = new THREE.Group();
      group.add(root);
      group.visible = false;
      scene.add(group);
      let mixer = null;
      if(gltf.animations && gltf.animations.length){
        mixer = new THREE.AnimationMixer(root);
        mixer.clipAction(findClip(gltf.animations, def.clipNames || ['Run','Running'])).play();
      } else {
        console.warn('"'+def.key+'" has no baked animation clips — it will show as a static pose.');
      }
      c.group = group; c.mixer = mixer; c.ready = true;
    }).catch(err=>console.warn('Chaser model failed to load ('+def.key+') — it will stay hidden.', err));
  });
}
let chaserLaneTimer = 0;
function updateChasers(dt){
  dt = dt || 0;
  chaserLaneTimer -= dt;
  if(chaserLaneTimer <= 0){
    chaserLaneTimer = 1.3 + Math.random()*1.3;
    chasers.forEach(c=>{ c.lane = Math.random() < 0.65 ? player.lane : Math.floor(Math.random()*3); });
  }
  chasers.forEach(c=>{
    if(!c.ready) return;
    if(c.mixer) c.mixer.update(dt);
    const targetX = laneX(c.lane);
    c.x += (targetX - c.x) * Math.min(1, dt*c.def.laneSpeed);
    let bobY = 0, leanZ = 0;
    if(!c.mixer){
      // no baked animation on this model — fake a run cycle with a simple bounce + lean
      const t = envTime*11 + (c.def.key==='cat' ? 1.7 : 0);
      bobY = Math.abs(Math.sin(t)) * 0.07;
      leanZ = Math.sin(t) * 0.06;
    }
    c.group.position.set(c.x, bobY, worldZ(GROUND_Y + c.def.gap));
    c.group.rotation.z = leanZ;
    c.group.visible = running;
  });
}

function updateCharacterPose(jumping, sliding, flying, tilt, jumpY, dt){
  if(!charGroup) return;
  if(playerMixer) playerMixer.update(dt||0);
  const wx = (player && player.x!==undefined) ? player.x : 0;
  const upY = -jumpY*Y_SCALE;
  charGroup.position.set(wx, Math.max(0,upY), 0);
  charGroup.rotation.z = (tilt||0)*0.28;

  const targetScaleY = sliding ? 0.56 : 1;
  charGroup.scale.y += (targetScaleY-charGroup.scale.y)*0.35;

  const phase = (!jumping && !sliding && !flying) ? Math.sin(distance*0.14) : 0;
  if(legL) legL.rotation.x = phase*0.5;
  if(legR) legR.rotation.x = -phase*0.5;
  if(armL) armL.rotation.x = -phase*0.45;
  if(armR) armR.rotation.x = phase*0.45;

  if(flameMesh){
    flameMesh.visible = !!flying;
    if(flying){ const flick=0.7+Math.sin(envTime*14)*0.25; flameMesh.scale.set(1,flick,1); }
  }
  if(shadowMesh){
    const jumpHeight = Math.max(0, upY);
    const s = Math.max(0.25, 1-jumpHeight/2.2);
    shadowMesh.scale.set(s,s,s);
    shadowMesh.position.set(wx, 0.012, 0);
    shadowMesh.visible = !flying;
  }
}

/* ---------- PER-FRAME ENVIRONMENT UPDATE ----------
   Blends sky/fog/ground/light colors smoothly between neighboring themes, and scrolls +
   recycles the scenery/lane-marker pools toward the camera (same o.y-style scroll value
   obstacles use, see worldZ()). */
function updateEnvironment(dt, distNow){
  if(!threeReady) return;
  const {themeA, themeB, t} = getThemeBlend(distNow);
  const sky = new THREE.Color(themeA.sky).lerp(new THREE.Color(themeB.sky), t);
  const fog = new THREE.Color(themeA.fogColor).lerp(new THREE.Color(themeB.fogColor), t);
  const ground = new THREE.Color(themeA.groundColor).lerp(new THREE.Color(themeB.groundColor), t);
  const sun = new THREE.Color(themeA.sunColor).lerp(new THREE.Color(themeB.sunColor), t);
  const hemiSky = new THREE.Color(themeA.hemiSky).lerp(new THREE.Color(themeB.hemiSky), t);
  const hemiGround = new THREE.Color(themeA.hemiGround).lerp(new THREE.Color(themeB.hemiGround), t);

  scene.background = sky;
  if(scene.fog){
    scene.fog.color = fog;
    scene.fog.near = themeA.fogNear + (themeB.fogNear-themeA.fogNear)*t;
    scene.fog.far  = themeA.fogFar  + (themeB.fogFar -themeA.fogFar )*t;
  }
  if(window._groundMat) window._groundMat.color = ground;
  if(sunLight){ sunLight.color = sun; sunLight.intensity = themeA.dirIntensity + (themeB.dirIntensity-themeA.dirIntensity)*t; }
  if(hemiLight){ hemiLight.color = hemiSky; hemiLight.groundColor = hemiGround; hemiLight.intensity = themeA.hemiIntensity + (themeB.hemiIntensity-themeA.hemiIntensity)*t; }
  if(sunSprite) sunSprite.material.color = sun;

  if(starPoints) starPoints.material.opacity = ((themeA.stars?(1-t):0) + (themeB.stars?t:0)) * 0.9;
  const snowAmt = (themeA.snow?(1-t):0) + (themeB.snow?t:0);
  if(snowPoints){
    snowPoints.material.opacity = snowAmt*0.85;
    if(snowAmt>0.02){
      const posAttr = snowPoints.geometry.attributes.position;
      for(let i=0;i<posAttr.count;i++){
        let y = posAttr.getY(i) - (dt||0)*1.6;
        if(y<0) y = 9+Math.random()*2;
        posAttr.setY(i, y);
      }
      posAttr.needsUpdate = true;
    }
  }

  const speed = running ? Math.min(430, baseSpeed + distNow/9) : 60;
  const step = speed*(dt||0);

  for(const p of sceneryFar){
    p.y += step;
    if(p.y > 1200){
      p.y = -2700 - Math.random()*300;
      p.seed = 0.5+Math.random()*0.6;
      buildFarProp(p.mesh, themeForScroll(p.y, distNow), p.seed);
    }
    p.mesh.position.set(p.side*p.xOff, 0, worldZ(p.y));
  }
  for(const p of sceneryMid){
    p.y += step;
    if(p.y > 700){
      p.y = -1750 - Math.random()*200;
      p.seed = 0.4+Math.random()*0.7;
      buildMidProp(p.mesh, themeForScroll(p.y, distNow), p.seed);
    }
    p.mesh.position.set(p.side*p.xOff, 0, worldZ(p.y));
  }
  for(const d of laneDashes){
    d.y += step;
    if(d.y > GROUND_Y+120) d.y -= 1400;
    const z = worldZ(d.y);
    d.meshL.position.set(-LANE_GAP/2, 0.006, z);
    d.meshR.position.set(LANE_GAP/2, 0.006, z);
    d.meshL.material.color.copy(new THREE.Color(themeA.laneLineColor).lerp(new THREE.Color(themeB.laneLineColor), t));
    d.meshR.material.color.copy(d.meshL.material.color);
  }
}

function drawIdleFrame(){
  updateEnvironment(0, idleDist||0);
  updateCharacterPose(false,false,false,0,0,0);
  updateChasers(0);
  if(threeReady) renderer.render(scene, camera);
}

/* menu background keeps drifting + cycling biomes even while not running */
let idleRaf=null, idleDist=0, idleLast=0;
function idleLoop(now){
  if(running){ idleRaf=null; return; }
  const dt = idleLast ? Math.min((now-idleLast)/1000, 1/15) : 0;
  idleLast = now;
  envTime += dt;
  idleDist += 220*dt;
  updateEnvironment(dt, idleDist);
  updateCharacterPose(false,false,false,0,0,dt);
  updateChasers(dt);
  if(threeReady) renderer.render(scene, camera);
  idleRaf = requestAnimationFrame(idleLoop);
}
function startIdleLoop(){
  if(running || idleRaf) return;
  idleLast = 0;
  idleRaf = requestAnimationFrame(idleLoop);
}
function stopIdleLoop(){ if(idleRaf){ cancelAnimationFrame(idleRaf); idleRaf=null; } }

function startGame(){
  sndRunStart();
  stopIdleLoop();
  document.getElementById('overlay').style.display='none';
  document.getElementById('storeOverlay').style.display='none';
  document.getElementById('reviveOverlay').style.display='none';
  player = {lane:1, targetLane:1, x:laneX(1), y:0, vy:0, jumping:false, sliding:false, slideTimer:0, tilt:0, flying:false};
  obstacles.forEach(disposeObj); coins.forEach(disposeObj); pickups.forEach(disposeObj);
  clearParticles3D();
  obstacles=[]; coins=[]; sparks=[]; dust=[]; pickups=[];
  baseSpeed=180; spawnDist=0; pickupSpawnDist=0; score=0; coinScore=0; distance=0; grace=1.1;
  shieldUsed = false; hasRevived = false;
  activePowerups = {}; powerupWarned = {};
  comboCount=0; comboTimer=0; milestoneTrack=0;
  lastBiomeUI = currentThemeIndex(0); // seed with the starting biome so the banner only fires on real transitions, not at run start
  missionProgress = { coinsInRun:0, pickupsUsed:0, distanceInRun:0 };
  if(isPowerupActive('headstart')){ coinScore += 50; }
  running=true;
  document.getElementById('scoreVal').textContent='0';
  startBeat();
  lastTime = performance.now();
  if(raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

let hasRevived = false;
function endGame(){
  running=false; stopBeat();
  if(raf) cancelAnimationFrame(raf);

  // offer a one-time revive if the player can afford it and hasn't used it this run
  if(!hasRevived && wallet >= 30){
    document.getElementById('reviveScoreVal').textContent = score;
    document.getElementById('reviveOverlay').style.display = 'flex';
    return;
  }
  finishRun();
}

function doRevive(){
  sndRevive();
  hasRevived = true;
  wallet -= 30;
  refreshWalletDisplay();
  document.getElementById('reviveOverlay').style.display = 'none';
  // clear nearby obstacles and give a moment of grace so it's not an instant re-crash
  obstacles = obstacles.filter(o => {
    const keep = o.y < groundY - 120 || o.y > groundY + 60;
    if(!keep) disposeObj(o);
    return keep;
  });
  grace = 1.2;
  running = true;
  stopIdleLoop();
  startBeat();
  lastTime = performance.now();
  raf = requestAnimationFrame(loop);
}
function declineRevive(){
  sndClick();
  document.getElementById('reviveOverlay').style.display = 'none';
  finishRun();
}

function finishRun(){
  const isNewBest = score > best;
  best = Math.max(best, score);
  const coinsEarned = Math.floor(coinScore/10);
  wallet += coinsEarned;
  missionProgress.coinsInRun = coinsEarned;
  missionProgress.distanceInRun = Math.max(missionProgress.distanceInRun, Math.floor(distance));
  checkMissions();
  renderMissions();
  refreshWalletDisplay();
  document.getElementById('bestVal').textContent = best;
  document.getElementById('overlayTitle').textContent = 'Busted!';
  document.getElementById('overlaySub').textContent = isNewBest ? 'New best score!' : '';
  const old = document.getElementById('overlayScore'); if(old) old.remove();
  const oldStats = document.getElementById('overlayStats'); if(oldStats) oldStats.remove();
  const scoreEl = document.createElement('div');
  scoreEl.className='overlay-score'; scoreEl.id='overlayScore'; scoreEl.textContent=score;
  const statsEl = document.createElement('div');
  statsEl.className='overlay-stats'; statsEl.id='overlayStats';
  statsEl.innerHTML = `<span>🪙 +${coinsEarned} coins</span><span>📏 ${Math.floor(distance)}m</span>`;
  const card = document.querySelector('#overlay .overlay-card');
  card.insertBefore(scoreEl, document.getElementById('overlayBtn'));
  card.insertBefore(statsEl, document.getElementById('overlayBtn'));
  document.getElementById('overlayBtn').textContent = '↺ Run Again';
  document.getElementById('overlay').style.display='flex';
  updateHeroPreview();
  shake = 14;
  startIdleLoop();
}

/* ---------- INPUT ---------- */
function gameInput(dir){
  if(!running) return;
  if(dir==='left' && player.lane>0){ player.lane--; player.tilt=-1; sndSwitch(); }
  if(dir==='right' && player.lane<2){ player.lane++; player.tilt=1; sndSwitch(); }
  if(dir==='up' && !player.jumping && !player.sliding){ player.jumping=true; player.vy=-430; sndJump(); }
  if(dir==='down' && !player.jumping){ player.sliding=true; player.slideTimer=0.5; sndSlide(); }
}
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') gameInput('left');
  if(e.key==='ArrowRight') gameInput('right');
  if(e.key==='ArrowUp'){ e.preventDefault(); gameInput('up'); }
  if(e.key==='ArrowDown'){ e.preventDefault(); gameInput('down'); }
});
let tsx=0, tsy=0, tst=0;
const stageEl = document.getElementById('stageWrap');
stageEl.addEventListener('touchstart', e=>{ tsx=e.touches[0].clientX; tsy=e.touches[0].clientY; tst=Date.now(); }, {passive:true});
stageEl.addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX-tsx, dy=e.changedTouches[0].clientY-tsy;
  if(Math.abs(dx)<8 && Math.abs(dy)<8 && Date.now()-tst<200) return; // ignore accidental taps
  if(Math.abs(dx)>Math.abs(dy)){ if(Math.abs(dx)>28) gameInput(dx>0?'right':'left'); }
  else{ if(Math.abs(dy)>28) gameInput(dy>0?'down':'up'); }
}, {passive:true});

/* ---------- SPAWNING (distance-based, not frame-based, so density is
   consistent regardless of framerate) ---------- */
const SPAWN_GAP = 260; // px of travel between spawns at slow speed
function maybeSpawn(){
  if(distance - spawnDist < currentSpawnGap()) return;
  spawnDist = distance;
  if(Math.random() < 0.42) spawnObstacle(); else spawnCoinRow();
}
function currentSpawnGap(){
  return Math.max(150, SPAWN_GAP - distance/12);
}
function spawnObstacle(){
  const lane = Math.floor(Math.random()*3);
  const type = Math.random()<0.5?'crate':'bar';
  const o = {lane, type, y:-40, hit:false};
  buildObstacleMesh(o);
  obstacles.push(o);
}
function spawnCoinRow(){
  const lane = Math.floor(Math.random()*3);
  const count = 3+Math.floor(Math.random()*3);
  for(let i=0;i<count;i++){
    const c = {lane, y:-40-i*32, taken:false, spin: Math.random()*Math.PI*2};
    buildCoinMesh(c);
    coins.push(c);
  }
}
function maybeSpawnPickup(){
  if(distance - pickupSpawnDist < PICKUP_GAP) return;
  pickupSpawnDist = distance;
  const ids = Object.keys(RUN_POWERUPS);
  const id = ids[Math.floor(Math.random()*ids.length)];
  const lane = Math.floor(Math.random()*3);
  const p = {lane, y:-50, id, taken:false};
  buildPickupMesh(p);
  pickups.push(p);
}

/* ---------- UPDATE (dt = seconds since last frame) ---------- */
function update(dt){
  dt = Math.min(dt, 1/20); // clamp so a dropped frame doesn't cause a huge jump
  distance += baseSpeed*dt;
  let speedPxPerSec = Math.min(430, baseSpeed + distance/9);
  score = Math.floor(distance/8) + coinScore;
  if(grace>0) grace = Math.max(0, grace-dt);
  envTime += dt;

  // distance milestones (roughly every few seconds, not several times a second)
  if(Math.floor(distance/1000) > milestoneTrack){ milestoneTrack = Math.floor(distance/1000); sndMilestone(); }

  // combo window for rapid-fire coin pitch escalation
  if(comboTimer>0){ comboTimer -= dt; if(comboTimer<=0){ comboTimer=0; comboCount=0; } }

  // changeable biome: announce + chime whenever the world shifts
  const biomeIdx = currentThemeIndex();
  if(biomeIdx !== lastBiomeUI){
    lastBiomeUI = biomeIdx;
    showBiomeBanner(THEMES[biomeIdx].name);
    sndBiome();
  }

  // upbeat run music (bouncy bassline + lead hook), tempo nudges up slightly with speed
  if(beatActive) tickMusic(dt, speedPxPerSec);

  // tick down active run power-ups
  for(const id in activePowerups){
    if(activePowerups[id] > 0){
      activePowerups[id] -= dt;
      if(activePowerups[id] <= 1.2 && activePowerups[id] > 0 && !powerupWarned[id]){
        powerupWarned[id] = true;
        sndWarnTick();
      }
      if(activePowerups[id] <= 0){
        activePowerups[id] = 0;
        if(id==='jetpack'){ player.flying=false; player.jumping=true; player.vy=0; } // fall back to the ground instead of staying stuck mid-air
      }
    }
  }
  renderPowerupStrip();

  const targetX = laneX(player.lane);
  player.x += (targetX-player.x) * Math.min(1, dt*10);
  player.tilt *= Math.pow(0.02, dt);

  if(player.flying){
    // jetpack: smoothly hold player up in the air, immune to ground obstacles
    const flyY = -70;
    player.y += (flyY - player.y) * Math.min(1, dt*6);
    player.jumping = false; player.vy = 0;
  } else if(player.jumping){
    player.vy += 1350*dt;
    player.y += player.vy*dt;
    if(player.y>=0){ player.y=0; player.jumping=false; player.vy=0; spawnDust(player.x); sndLand(); }
  }
  if(player.sliding){
    player.slideTimer -= dt;
    if(player.slideTimer<=0) player.sliding=false;
  }

  maybeSpawn();
  maybeSpawnPickup();

  for(const p of pickups){
    p.y += speedPxPerSec*dt;
    if(!p.taken && p.lane===player.lane && Math.abs(p.y-groundY)<28){
      p.taken = true;
      activateRunPowerup(p.id);
      showPopup(RUN_POWERUPS[p.id].label+'!', {x:laneX(p.lane), y:1.6, z:0});
    }
  }
  pickups = pickups.filter(p=>{
    const keep = p.y<DESPAWN_Y && !p.taken;
    if(!keep) disposeObj(p);
    return keep;
  });

  for(const o of obstacles){
    o.y += speedPxPerSec*dt;
    const inZone = o.lane===player.lane && Math.abs(o.y-groundY)<15;
    if(grace<=0 && !o.hit && inZone && !player.flying){
      const dodged = (o.type==='crate' && player.jumping && player.y<-6) ||
                     (o.type==='bar' && player.sliding);
      if(!dodged){
        o.hit=true;
        if(isPowerupActive('shield') && !shieldUsed){
          shieldUsed = true;
          disposeObj(o);
          obstacles = obstacles.filter(x=>x!==o);
          showPopup('🛡️ Shield used!', {x:laneX(player.lane), y:1.6, z:0});
          sndPowerup();
          continue;
        }
        sndHit(); shake=14; redFlashT=0.2; endGame(); return;
      }
    }
  }
  obstacles = obstacles.filter(o=>{
    const keep = o.y<DESPAWN_Y;
    if(!keep) disposeObj(o);
    return keep;
  });

  for(const c of coins){
    c.y += speedPxPerSec*dt;
    c.spin += 5.4*dt;
    const cx = laneX(c.lane);
    const magnetOn = isPowerupActive('magnet') || isRunPowerupActive('magnet');
    const laneMatch = c.lane===player.lane || (magnetOn && Math.abs(c.lane-player.lane)===1);
    if(!c.taken && laneMatch && Math.abs(c.y-groundY)<26 && !(player.jumping && player.y<-30) && !player.flying){
      c.taken=true;
      const mult = isRunPowerupActive('multi') ? 2 : 1;
      coinScore += 10 * mult;
      comboTimer = 0.6; comboCount++;
      sndCoin(false, comboCount);
      showPopup('+10', {x:cx, y:1.4, z:0});
      spawnSparks(cx, groundY-20);
    }
  }
  // jetpack auto-collects everything in its lane while flying
  if(player.flying){
    for(const c of coins){
      if(!c.taken && c.lane===player.lane && c.y > -50 && c.y < groundY+100){
        c.taken=true;
        const mult = isRunPowerupActive('multi') ? 2 : 1;
        coinScore += 10*mult;
        comboTimer = 0.6; comboCount++;
        sndCoin(false, comboCount);
        spawnSparks(laneX(c.lane), c.y);
      }
    }
  }
  coins = coins.filter(c=>{
    const keep = c.y<DESPAWN_Y && !c.taken;
    if(!keep) disposeObj(c);
    return keep;
  });

  for(const s of sparks){
    s.x+=s.vx*dt*60; s.y+=s.vy*dt*60; s.z+=s.vz*dt*60; s.vy-=6*dt; s.life-=dt;
    if(s.poolIdx>=0 && sparkPool[s.poolIdx]){
      const mesh = sparkPool[s.poolIdx];
      mesh.position.set(s.x,s.y,s.z);
      mesh.material.opacity = Math.max(0, s.life/0.36);
    }
  }
  sparks = sparks.filter(s=>{
    const keep = s.life>0;
    if(!keep && s.poolIdx>=0 && sparkPool[s.poolIdx]) sparkPool[s.poolIdx].visible=false;
    return keep;
  });
  for(const d of dust){
    d.life-=dt; d.x += d.vx*dt*60; d.r += 1.1*dt;
    if(d.poolIdx>=0 && dustPool[d.poolIdx]){
      const mesh = dustPool[d.poolIdx];
      mesh.position.x = d.x;
      mesh.scale.set(d.r,d.r,d.r);
      mesh.material.opacity = Math.max(0, (d.life/0.3)*0.5);
    }
  }
  dust = dust.filter(d=>{
    const keep = d.life>0;
    if(!keep && d.poolIdx>=0 && dustPool[d.poolIdx]) dustPool[d.poolIdx].visible=false;
    return keep;
  });

  if(shake>0) shake = Math.max(0, shake - dt*40);
  if(redFlashT>0) redFlashT = Math.max(0, redFlashT - dt);

  document.getElementById('scoreVal').textContent = score;
}

function spawnSparks(x,y){
  const wz = worldZ(y);
  for(let i=0;i<8;i++){
    const a = Math.random()*Math.PI*2;
    const s = {
      x, y:1.1+Math.random()*0.25, z:wz,
      vx:Math.cos(a)*1.1, vy:1.0+Math.random()*1.1, vz:Math.sin(a)*1.1,
      life:0.36, color: Math.random()>0.5?0xF0B93D:0x22C577, poolIdx:-1
    };
    if(threeReady && sparkPool.length){
      s.poolIdx = sparkPoolIdx; sparkPoolIdx = (sparkPoolIdx+1)%sparkPool.length;
      const mesh = sparkPool[s.poolIdx];
      mesh.material.color.setHex(s.color); mesh.material.opacity=1; mesh.visible=true;
      mesh.position.set(s.x,s.y,s.z);
    }
    sparks.push(s);
  }
}
function spawnDust(x){
  const wz = worldZ(groundY+4);
  for(let i=0;i<5;i++){
    const d = {
      x:x+(Math.random()*0.5-0.25), y:0.03, z:wz+(Math.random()*0.3-0.15),
      vx:(Math.random()*0.5-0.25), r:0.05, life:0.3, poolIdx:-1
    };
    if(threeReady && dustPool.length){
      d.poolIdx = dustPoolIdx; dustPoolIdx = (dustPoolIdx+1)%dustPool.length;
      const mesh = dustPool[d.poolIdx];
      mesh.material.opacity=0.5; mesh.visible=true;
      mesh.position.set(d.x,d.y,d.z);
      mesh.scale.set(d.r,d.r,d.r);
    }
    dust.push(d);
  }
}
/* ---------- RENDER ---------- */
function shadeColor(hex, percent){
  const num = parseInt(hex.replace('#',''),16);
  let r = (num>>16) + Math.round(255*percent/100);
  let g = ((num>>8)&0xff) + Math.round(255*percent/100);
  let b = (num&0xff) + Math.round(255*percent/100);
  r = Math.max(0,Math.min(255,r)); g = Math.max(0,Math.min(255,g)); b = Math.max(0,Math.min(255,b));
  return `rgb(${r},${g},${b})`;
}

// Static standing-pose character portrait, used for store cards and the
// main menu preview. Independent of live game state.
function drawCharacterPortrait(canvasEl, skin){
  const pctx = canvasEl.getContext('2d');
  const w = canvasEl.width, h = canvasEl.height;
  pctx.clearRect(0,0,w,h);
  pctx.save();
  pctx.translate(w/2, h*0.86);
  const scale = h/120;
  pctx.scale(scale, scale);

  const torsoTop = -58, torsoH = 34, hipY = torsoTop+torsoH, legLen = 24;

  // ground shadow
  pctx.fillStyle = 'rgba(0,0,0,.2)';
  pctx.beginPath(); pctx.ellipse(0,6,17,5,0,0,Math.PI*2); pctx.fill();

  // legs + shoes
  for(const side of [-1,1]){
    const lx = side*6.5;
    pctx.fillStyle = '#2B2E3D';
    pRoundRect(pctx, lx-4, hipY, 8, legLen, 3); pctx.fill();
    pctx.fillStyle = '#B9BEC9';
    pRoundRect(pctx, lx-5, hipY+legLen-2, 10, 6, 3); pctx.fill();
  }

  // arms at sides
  pctx.fillStyle = shadeColor(skin.color, 6);
  pRoundRect(pctx, -16, torsoTop+8, 6, 16, 3); pctx.fill();
  pRoundRect(pctx, 10, torsoTop+8, 6, 16, 3); pctx.fill();

  // sweater
  const bodyGrd = pctx.createLinearGradient(-15,torsoTop,15,hipY);
  bodyGrd.addColorStop(0, shadeColor(skin.color, 20));
  bodyGrd.addColorStop(1, shadeColor(skin.color, -10));
  pctx.fillStyle = bodyGrd;
  pRoundRect(pctx, -15, torsoTop, 30, torsoH, 12); pctx.fill();
  pctx.fillStyle = shadeColor(skin.color, -20);
  pctx.beginPath();
  pctx.moveTo(-7, torsoTop+2); pctx.lineTo(0, torsoTop+9); pctx.lineTo(7, torsoTop+2);
  pctx.lineTo(6, torsoTop); pctx.lineTo(-6, torsoTop); pctx.closePath(); pctx.fill();

  // neck + head
  pctx.fillStyle = '#F0C9A0';
  pctx.fillRect(-4, torsoTop-6, 8, 8);
  const headY = torsoTop-15;
  const headGrd = pctx.createRadialGradient(-3,headY-3,1, 0,headY,13);
  headGrd.addColorStop(0,'#FFEBC8'); headGrd.addColorStop(1,'#F0C9A0');
  pctx.fillStyle = headGrd;
  pctx.beginPath(); pctx.arc(0,headY,12,0,Math.PI*2); pctx.fill();

  // curly hair
  pctx.fillStyle = '#231F2E';
  const curl=(cx,cy,r)=>{ pctx.beginPath(); pctx.arc(cx,cy,r,0,Math.PI*2); pctx.fill(); };
  curl(0,headY-11,8); curl(-8,headY-8,6.5); curl(8,headY-8,6.5);
  curl(-5,headY-14,5.5); curl(5,headY-14,5.5); curl(0,headY-16,5);
  curl(-10,headY-3,4.5); curl(10,headY-3,4.5);

  // face
  pctx.fillStyle = '#241D15';
  pctx.beginPath(); pctx.arc(-4,headY-1,1.4,0,Math.PI*2); pctx.fill();
  pctx.beginPath(); pctx.arc(4,headY-1,1.4,0,Math.PI*2); pctx.fill();
  pctx.strokeStyle = '#241D15'; pctx.lineWidth = 1.4; pctx.lineCap='round';
  pctx.beginPath(); pctx.arc(0,headY+2,4,0.15*Math.PI,0.85*Math.PI); pctx.stroke();
  pctx.fillStyle = 'rgba(240,110,100,.35)';
  pctx.beginPath(); pctx.arc(-7,headY+3,2,0,Math.PI*2); pctx.fill();
  pctx.beginPath(); pctx.arc(7,headY+3,2,0,Math.PI*2); pctx.fill();

  pctx.restore();
}
function pRoundRect(pctx,x,y,w,h,r){
  pctx.beginPath();
  pctx.moveTo(x+r,y);
  pctx.arcTo(x+w,y,x+w,y+h,r);
  pctx.arcTo(x+w,y+h,x,y+h,r);
  pctx.arcTo(x,y+h,x,y,r);
  pctx.arcTo(x,y,x+w,y,r);
  pctx.closePath();
}

/* ---------- RENDER ---------- */
function render(dt){
  if(!threeReady) return;
  updateEnvironment(dt, distance);

  for(const o of obstacles){ if(o.mesh) o.mesh.position.set(laneX(o.lane), 0, worldZ(o.y)); }
  for(const c of coins){
    if(c.mesh){
      c.mesh.visible = !c.taken;
      c.mesh.position.set(laneX(c.lane), 1.25, worldZ(c.y));
      c.mesh.rotation.y = c.spin;
    }
  }
  for(const p of pickups){
    if(p.mesh){
      p.mesh.visible = !p.taken;
      const bob = Math.sin(p.y*0.05)*0.08;
      p.mesh.position.set(laneX(p.lane), 1.4+bob, worldZ(p.y));
    }
  }

  updateCharacterPose(player.jumping, player.sliding, player.flying, player.tilt, player.y, dt);
  updateChasers(dt);

  const sx = shake>0 ? (Math.random()*2-1)*shake*0.01 : 0;
  const sy = shake>0 ? (Math.random()*2-1)*shake*0.01 : 0;
  camera.position.set(sx, CAM_HEIGHT+sy, CAM_BACK);
  camera.lookAt(sx, CAM_LOOK_Y, CAM_LOOK_AHEAD);

  const flashEl = document.getElementById('hitFlash');
  if(flashEl) flashEl.style.opacity = redFlashT>0 ? Math.min(0.55,(redFlashT/0.2)*0.55) : 0;

  renderer.render(scene, camera);
}

/* ---------- MAIN LOOP (delta-time based) ---------- */
let fpsSamples = [];
function loop(now){
  if(!running) return;
  const dt = Math.min((now-lastTime)/1000, 1/15);
  lastTime = now;

  update(dt);
  render(dt);

  fpsSamples.push(1/Math.max(dt,0.001));
  if(fpsSamples.length>30) fpsSamples.shift();
  const avgFps = fpsSamples.reduce((a,b)=>a+b,0)/fpsSamples.length;
  document.getElementById('fpsBadge').textContent = Math.round(avgFps)+' fps';

  raf = requestAnimationFrame(loop);
}

initThree();
resize();
refreshWalletDisplay();
renderMissions();
updateHeroPreview();
startIdleLoop();
</script>
